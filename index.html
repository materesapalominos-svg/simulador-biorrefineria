<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Biorefinería Challenge</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Atkinson+Hyperlegible:ital,wght@0,400;0,700;1,400&family=Barlow+Condensed:wght@500;600;700&family=IBM+Plex+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
/* Idea de diseño: hoja de ingeniería. Barra superior tipo cajetín de plano (progreso, puntos, tiempo),
   unidades de proceso con etiquetas de equipo (M-101, R-201) y tarjetas sobrias. El naranja se reserva
   para la acción y la transformación; el azul, para el proceso; el verde, para la biomasa. */
:root{
  --bg:#f3f6f2; --surface:#ffffff; --surface-2:#e9f0e8; --ink:#13251c; --muted:#4a5f54; --line:#c5d3c8;
  --green-900:#0f3d2e; --green-300:#9bd18a; --green-tint:#e2f2dc;
  --accent:#b84e00; --on-accent:#ffffff; --accent-tint:#fdeede;
  --blue:#1f5f8b; --blue-tint:#e3eef6;
  --ok:#17693a; --ok-tint:#e1f3e6; --bad:#a8261c; --bad-tint:#fbe9e6; --info:#1f5f8b; --info-tint:#e3eef6;
  --head-bg:#0f3d2e; --head-ink:#f1f7f0; --head-line:#2f6350;
  --f-display:"Barlow Condensed","Arial Narrow",Arial,sans-serif;
  --f-body:"Atkinson Hyperlegible",Verdana,"Segoe UI",sans-serif;
  --f-mono:"IBM Plex Mono",ui-monospace,Consolas,monospace;
  --r:6px;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#0d1813; --surface:#14241c; --surface-2:#1b3026; --ink:#e7f0e9; --muted:#a5b9ad; --line:#2f4a3c;
    --green-900:#bfe6b1; --green-300:#9bd18a; --green-tint:#1d3a2b;
    --accent:#f29244; --on-accent:#1c0e02; --accent-tint:#3a2412;
    --blue:#7cbbe6; --blue-tint:#16303f;
    --ok:#7fd69b; --ok-tint:#163524; --bad:#ff9a8e; --bad-tint:#3d1a16; --info:#7cbbe6; --info-tint:#16303f;
    --head-bg:#0a2219; --head-ink:#f1f7f0; --head-line:#2f6350;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --bg:#0d1813; --surface:#14241c; --surface-2:#1b3026; --ink:#e7f0e9; --muted:#a5b9ad; --line:#2f4a3c;
  --green-900:#bfe6b1; --green-300:#9bd18a; --green-tint:#1d3a2b;
  --accent:#f29244; --on-accent:#1c0e02; --accent-tint:#3a2412;
  --blue:#7cbbe6; --blue-tint:#16303f;
  --ok:#7fd69b; --ok-tint:#163524; --bad:#ff9a8e; --bad-tint:#3d1a16; --info:#7cbbe6; --info-tint:#16303f;
  --head-bg:#0a2219; --head-ink:#f1f7f0; --head-line:#2f6350;
  color-scheme:dark;
}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:17px;line-height:1.5}
h1,h2,h3,h4{font-family:var(--f-display);font-weight:600;line-height:1.1;margin:0;text-wrap:balance;letter-spacing:.01em}
h1{font-size:clamp(2.4rem,6vw,4rem);font-weight:700;text-transform:uppercase}
h2{font-size:2rem}
h3{font-size:1.45rem}
h4{font-size:1.15rem;letter-spacing:.03em;text-transform:uppercase;color:var(--muted)}
p{margin:0}
button{font:inherit;color:inherit;cursor:pointer}
button:disabled{cursor:not-allowed}
:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.mono{font-family:var(--f-mono);font-size:.8rem;letter-spacing:.02em}
.muted{color:var(--muted)}
.small{font-size:.9rem}
.stack{display:flex;flex-direction:column;gap:16px}
.stack-s{display:flex;flex-direction:column;gap:8px}
.row{display:flex;flex-wrap:wrap;gap:12px;align-items:center}
.grow{flex:1 1 auto}
.measure{max-width:68ch}

/* Cajetín superior */
.tb{background:var(--head-bg);color:var(--head-ink);position:sticky;top:0;z-index:10;border-bottom:3px solid var(--accent)}
.tb-in{max-width:1180px;margin:0 auto;padding:8px 16px;display:flex;flex-wrap:wrap;gap:8px 16px;align-items:center}
.brand{display:flex;align-items:baseline;gap:8px;font-family:var(--f-display);font-weight:700;font-size:1.25rem;text-transform:uppercase;letter-spacing:.04em}
.brand .mono{opacity:.8;border:1px solid var(--head-line);padding:1px 6px;border-radius:3px}
.steps{display:flex;flex-wrap:wrap;gap:4px;flex:1 1 auto}
.step{background:transparent;border:1px solid var(--head-line);color:var(--head-ink);border-radius:4px;padding:5px 10px;font-family:var(--f-display);font-weight:600;font-size:1.05rem;letter-spacing:.03em;display:flex;gap:6px;align-items:center}
.step[aria-current="page"]{background:var(--head-ink);color:#0f3d2e;border-color:var(--head-ink)}
.step .mk{font-family:var(--f-mono);font-size:.75rem}
.cells{display:flex;gap:0;border:1px solid var(--head-line);border-radius:4px;overflow:hidden}
.cell{padding:3px 10px;border-right:1px solid var(--head-line);display:flex;flex-direction:column;min-width:74px}
.cell:last-child{border-right:0}
.cell b{font-family:var(--f-mono);font-weight:500;font-size:.95rem;font-variant-numeric:tabular-nums}
.cell span{font-size:.68rem;text-transform:uppercase;letter-spacing:.08em;opacity:.8}
.pbar{height:5px;background:var(--head-line);border-radius:3px;overflow:hidden;margin-top:3px;width:88px}
.pbar i{display:block;height:100%;background:var(--green-300)}
.tb .ghost{border:1px solid var(--head-line);background:transparent;color:var(--head-ink);border-radius:4px;padding:6px 10px;font-size:.85rem}
@media (max-width:1000px){.tb{position:static}}

main{max-width:1180px;margin:0 auto;padding:24px 16px 40px;display:flex;flex-direction:column;gap:24px}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:20px}
.card.tight{padding:14px}
.eyebrow{font-family:var(--f-mono);font-size:.78rem;text-transform:uppercase;letter-spacing:.1em;color:var(--blue)}
.lvl-head{display:flex;flex-wrap:wrap;gap:12px 24px;align-items:flex-end;justify-content:space-between;border-bottom:2px solid var(--ink);padding-bottom:12px}
.lvl-meta{display:flex;gap:8px;flex-wrap:wrap}
.tag{font-family:var(--f-mono);font-size:.78rem;border:1px solid var(--line);border-radius:3px;padding:2px 8px;background:var(--surface);white-space:nowrap}
.tag.ok{border-color:var(--ok);color:var(--ok);background:var(--ok-tint)}
.tag.pend{border-style:dashed}

.btn{background:var(--accent);color:var(--on-accent);border:0;border-radius:var(--r);padding:10px 18px;font-weight:700;font-size:1rem;transition:transform .12s ease,filter .12s ease}
.btn:hover{filter:brightness(1.08)}
.btn:active{transform:translateY(1px)}
.btn.sec{background:var(--surface);color:var(--ink);border:2px solid var(--ink)}
.btn.blue{background:var(--blue);color:var(--surface)}
.btn.sm{padding:6px 12px;font-size:.9rem}
.btn:disabled{opacity:.5}
.navrow{display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;border-top:1px solid var(--line);padding-top:16px}

.fb{border-left:5px solid var(--info);background:var(--info-tint);padding:10px 14px;border-radius:0 var(--r) var(--r) 0;display:flex;flex-direction:column;gap:6px;animation:fbin .25s ease}
.fb.ok{border-color:var(--ok);background:var(--ok-tint)}
.fb.bad{border-color:var(--bad);background:var(--bad-tint)}
.fb strong{font-family:var(--f-display);font-size:1.1rem;letter-spacing:.03em;text-transform:uppercase}
.fb.ok strong{color:var(--ok)} .fb.bad strong{color:var(--bad)} .fb.info strong{color:var(--info)}
@keyframes fbin{from{transform:translateY(-4px);opacity:.4}to{transform:none;opacity:1}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* Inicio */
.hero{display:grid;grid-template-columns:1.1fr .9fr;gap:24px;align-items:stretch}
@media (max-width:860px){.hero{grid-template-columns:1fr}}
.hero-sub{font-family:var(--f-display);font-size:1.6rem;font-weight:500;color:var(--accent)}
.plano{align-self:start;border:2px solid var(--ink);border-radius:2px;background:var(--surface);display:flex;flex-direction:column}
.plano-body{padding:16px;display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:center;flex:1}
.plano-col{display:flex;flex-direction:column;gap:10px;align-items:center}
.plano-units{display:grid;grid-template-columns:1fr 1fr;gap:10px;border:1.5px dashed var(--blue);padding:12px;border-radius:4px}
.unit-mini{display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--blue)}
.plano-foot{display:grid;grid-template-columns:2fr 1fr 1fr;border-top:2px solid var(--ink)}
.plano-foot div{padding:4px 8px;border-right:1px solid var(--ink);font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase}
.plano-foot div:last-child{border-right:0}
.ico{width:44px;height:44px;flex:none}
.ico svg,.gly svg{width:100%;height:100%;display:block}
.ico.res{color:var(--ok)} .ico.pro{color:var(--accent)} .ico.tec{color:var(--blue)}
.arrow{font-family:var(--f-mono);color:var(--muted);font-size:1.2rem}
.lvl-list{display:grid;grid-template-columns:repeat(4,1fr);gap:12px}
@media (max-width:860px){.lvl-list{grid-template-columns:1fr 1fr}}
@media (max-width:460px){.lvl-list{grid-template-columns:1fr}}
.lvl-item{border-top:4px solid var(--blue);padding-top:8px}
.lvl-item:nth-child(2){border-color:var(--green-300)} .lvl-item:nth-child(3){border-color:var(--accent)} .lvl-item:nth-child(4){border-color:var(--ink)}
.note-ia{border:1px solid var(--line);border-left:5px solid var(--blue);background:var(--surface);padding:10px 14px;font-size:.9rem;border-radius:0 var(--r) var(--r) 0}
ol.inst{margin:0;padding-left:1.2em;display:flex;flex-direction:column;gap:6px}

/* Nivel 1 */
.trays{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:860px){.trays{grid-template-columns:1fr}}
.tray{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--surface-2);display:flex;flex-direction:column;gap:8px}
.tray-cards{display:flex;flex-direction:column;gap:6px}
.cardbtn{display:flex;align-items:center;gap:10px;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:8px 10px;width:100%;min-height:60px}
.cardbtn:hover:not(:disabled){border-color:var(--ink)}
.cardbtn[aria-pressed="true"]{border-color:var(--accent);box-shadow:0 0 0 3px var(--accent-tint);background:var(--accent-tint)}
.cardbtn:disabled{opacity:.45;border-style:dashed}
.cardbtn b{display:block;line-height:1.2}
.cardbtn small{color:var(--muted);line-height:1.2;display:block}
.lines{display:flex;flex-direction:column;gap:10px}
.line{border:1px solid var(--line);border-radius:var(--r);padding:10px;background:var(--surface);display:flex;flex-direction:column;gap:8px}
.line.done{border-color:var(--ok)}
.line-row{display:grid;grid-template-columns:auto 1fr auto 1fr auto 1fr auto;gap:8px;align-items:center}
@media (max-width:760px){.line-row{grid-template-columns:1fr}.line-row .arrow{display:none}}
.slot{min-height:58px;border:2px dashed var(--muted);border-radius:var(--r);background:var(--bg);padding:6px 10px;text-align:left;display:flex;align-items:center;gap:8px;width:100%}
.slot.fill{border-style:solid;border-color:var(--ink);background:var(--surface)}
.slot.target{border-color:var(--accent);background:var(--accent-tint)}
.slot.bad{border-color:var(--bad)}
.slot .ico{width:34px;height:34px}
.slot small{display:block;color:var(--muted);font-family:var(--f-mono);font-size:.7rem;text-transform:uppercase}
.line-n{font-family:var(--f-mono);font-size:.8rem;writing-mode:horizontal-tb}

/* Opciones de desafío */
.parte{border:0;padding:0;margin:0;display:flex;flex-direction:column;gap:8px;min-width:0}
.parte legend{font-weight:700;padding:0;margin-bottom:6px}
.op{display:flex;gap:10px;align-items:flex-start;text-align:left;background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px 12px;width:100%}
.op:hover:not(:disabled){border-color:var(--ink)}
.op[aria-pressed="true"]{border-color:var(--blue);background:var(--blue-tint)}
.op .mk{font-family:var(--f-mono);flex:none;width:1.4em}
.op.is-ok{border-color:var(--ok);background:var(--ok-tint);opacity:1}
.op.is-x{opacity:.55;text-decoration:line-through;text-decoration-color:var(--bad)}
.op:disabled:not(.is-ok):not(.is-x){opacity:.6}
.scen{background:var(--surface-2);border-radius:var(--r);padding:12px 14px;border:1px solid var(--line)}

/* Nivel 2 */
.est-tabs{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
@media (max-width:760px){.est-tabs{grid-template-columns:1fr 1fr}}
.est-tab{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:8px 10px;text-align:left;display:flex;gap:8px;align-items:center}
.est-tab[aria-selected="true"]{border-color:var(--blue);background:var(--blue-tint)}
.est-tab .ico{width:36px;height:36px}
.est-tab b{font-family:var(--f-display);font-size:1.15rem;display:block;line-height:1.1}
.subtabs{display:flex;flex-wrap:wrap;gap:0;border-bottom:2px solid var(--ink)}
.subtab{background:transparent;border:0;border-bottom:4px solid transparent;padding:8px 14px;font-family:var(--f-display);font-size:1.15rem;font-weight:600;margin-bottom:-2px}
.subtab[aria-selected="true"]{border-color:var(--accent);color:var(--accent)}
.pfd{display:flex;gap:6px;overflow-x:auto;padding:6px 2px 10px}
.unit{flex:1 0 150px;max-width:230px;display:flex;flex-direction:column;align-items:center;gap:4px;border:2px dashed var(--muted);border-radius:var(--r);padding:8px;background:var(--bg);text-align:center;position:relative}
.unit.set{border:2px solid var(--blue);background:var(--surface)}
.unit.next{border-color:var(--accent);background:var(--accent-tint)}
.unit.sel{box-shadow:0 0 0 3px var(--blue-tint)}
.unit .gly{width:52px;height:52px;color:var(--blue)}
.unit .io{font-size:.74rem;color:var(--muted);line-height:1.2;min-height:1.8em}
.unit .io.in::before{content:"↓ "} .unit .io.out::before{content:"↳ "} .unit .io:empty::before{content:""}
.unit b{line-height:1.15;font-size:.95rem}
.pfd-arrow{align-self:center;font-family:var(--f-mono);color:var(--muted);flex:none}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.chip{background:var(--surface);border:2px solid var(--ink);border-radius:999px;padding:6px 14px;font-size:.95rem}
.chip:hover{background:var(--accent-tint)}
.ficha details{border-top:1px solid var(--line);padding:8px 0}
.ficha summary{font-weight:700;cursor:pointer}
.ficha details p{margin-top:6px}
.vars{display:grid;grid-template-columns:1fr 1fr;gap:20px}
@media (max-width:860px){.vars{grid-template-columns:1fr}}
.seg{border:0;padding:0;margin:0;min-width:0}
.seg legend{font-weight:700;padding:0;margin-bottom:4px}
.seg-in{display:flex;flex-wrap:wrap;gap:6px}
.seg label{border:2px solid var(--line);border-radius:var(--r);padding:6px 10px;font-size:.92rem;cursor:pointer;background:var(--surface);display:flex;gap:6px;align-items:center}
.seg input{accent-color:var(--blue);margin:0}
.seg label:has(input:checked){border-color:var(--blue);background:var(--blue-tint)}
.seg label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.ind{display:flex;flex-direction:column;gap:4px}
.meter{display:grid;grid-template-columns:repeat(5,1fr);gap:3px}
.meter i{height:12px;background:var(--surface-2);border:1px solid var(--line);border-radius:2px}
.meter i.on{background:var(--blue);border-color:var(--blue)}
.meter i.ref{border-color:var(--ink)}
.ind-lab{display:flex;justify-content:space-between;gap:8px;font-size:.92rem}
.ind-lab span:last-child{font-family:var(--f-mono);font-size:.8rem}
ul.notes{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px;font-size:.95rem}

/* Nivel 3 */
.substeps{display:flex;flex-wrap:wrap;gap:6px}
.substep{border:2px solid var(--line);background:var(--surface);border-radius:var(--r);padding:6px 12px;font-family:var(--f-display);font-size:1.05rem;font-weight:600;display:flex;gap:6px}
.substep[aria-current="step"]{border-color:var(--accent);background:var(--accent-tint)}
.substep:disabled{opacity:.5}
.res-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
@media (max-width:760px){.res-grid{grid-template-columns:1fr}}
.pick{background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:14px;text-align:left;display:flex;flex-direction:column;gap:8px}
.pick[aria-pressed="true"]{border-color:var(--accent);background:var(--accent-tint)}
.pick:hover{border-color:var(--ink)}
.tablewrap{overflow-x:auto}
table.mx{border-collapse:collapse;width:100%;min-width:620px}
table.mx th,table.mx td{border:1px solid var(--line);padding:8px 10px;vertical-align:top;text-align:left}
table.mx thead th{background:var(--green-900);color:var(--surface);font-family:var(--f-display);font-size:1.1rem;font-weight:600}
table.mx tbody th{font-weight:700;width:30%}
table.mx tr.guia td{background:var(--info-tint);font-size:.92rem;border-left:5px solid var(--info)}
.rate{display:flex;gap:4px;flex-wrap:wrap;border:0;padding:0;margin:0}
.rate label{border:2px solid var(--line);border-radius:4px;padding:3px 8px;font-size:.88rem;cursor:pointer;display:flex;gap:4px;align-items:center}
.rate input{margin:0;accent-color:var(--blue)}
.rate label:has(input:checked){border-color:var(--blue);background:var(--blue-tint);font-weight:700}
.rate label:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
textarea{width:100%;font:inherit;color:var(--ink);background:var(--surface);border:2px solid var(--line);border-radius:var(--r);padding:10px;resize:vertical;min-height:110px}
textarea:focus{border-color:var(--blue)}
label.fld{font-weight:700;display:block;margin-bottom:4px}
.wc{font-family:var(--f-mono);font-size:.8rem;color:var(--muted)}
.two{display:grid;grid-template-columns:1fr 1fr;gap:16px}
@media (max-width:860px){.two{grid-template-columns:1fr}}
.radio-card{display:flex;gap:10px;align-items:flex-start;border:2px solid var(--line);border-radius:var(--r);padding:10px 12px;cursor:pointer;background:var(--surface)}
.radio-card:has(input:checked){border-color:var(--accent);background:var(--accent-tint)}
.radio-card:has(input:focus-visible){outline:3px solid var(--accent);outline-offset:2px}
.radio-card input{margin-top:5px;accent-color:var(--accent)}
table.rub{border-collapse:collapse;width:100%;min-width:560px}
table.rub th,table.rub td{border:1px solid var(--line);padding:8px 10px;text-align:left;vertical-align:top}
table.rub thead th{background:var(--surface-2);font-family:var(--f-display);font-size:1.05rem}

/* Cierre */
.score{display:grid;grid-template-columns:auto 1fr;gap:24px;align-items:center}
@media (max-width:700px){.score{grid-template-columns:1fr}}
.big{font-family:var(--f-display);font-weight:700;font-size:5rem;line-height:.9;font-variant-numeric:tabular-nums}
.big small{font-size:1.6rem;font-weight:500;color:var(--muted)}
.bars{display:flex;flex-direction:column;gap:8px}
.bar{display:grid;grid-template-columns:150px 1fr 70px;gap:10px;align-items:center;font-size:.92rem}
@media (max-width:520px){.bar{grid-template-columns:1fr 60px}.bar .track{grid-column:1/-1;order:3}}
.track{height:14px;background:var(--surface-2);border:1px solid var(--line);border-radius:2px;overflow:hidden}
.track i{display:block;height:100%;background:var(--blue)}
.bar b{font-family:var(--f-mono);font-weight:500;text-align:right;font-variant-numeric:tabular-nums}
ul.plain{margin:0;padding-left:1.1em;display:flex;flex-direction:column;gap:6px}
pre.rep{white-space:pre-wrap;word-break:break-word;font-family:var(--f-mono);font-size:.82rem;background:var(--surface-2);border:1px solid var(--line);padding:14px;border-radius:var(--r);max-height:460px;overflow:auto;margin:0}
.confirm{background:var(--bad-tint);border:2px solid var(--bad);border-radius:var(--r);padding:12px 16px}
footer.ft{max-width:1180px;margin:0 auto;padding:0 16px 32px}

function chSt(id) { return S.ch[id] || (S.ch[id] = { sel: {}, wrong: {}, done: {}, tries: 0, ok: false, fb: null, errs: [] }); }
function chPick(id, pi, oid) {
  const d = chDef(id), st = chSt(id), p = d.partes[pi];
  if (st.ok || st.done[pi]) return;
  if (p.tipo === 'single') st.sel[pi] = st.sel[pi] === oid ? null : oid;
  else { const a = st.sel[pi] || (st.sel[pi] = []); const ix = a.indexOf(oid); if (ix >= 0) a.splice(ix, 1); else a.push(oid); }
}
function chCheck(id) {
  const d = chDef(id), st = chSt(id); if (st.ok) return;
  const multi = d.partes.length > 1;
  const pend = d.partes.findIndex((p, i) => !st.done[i] && (p.tipo === 'single' ? !st.sel[i] : !(st.sel[i] || []).length));
  if (pend >= 0) { st.fb = { k: 'info', items: [{ t: multi ? `Falta responder: ${d.partes[pend].lab || 'parte ' + (pend + 1)}.` : 'Selecciona una respuesta antes de verificar.' }] }; return; }
  st.tries++;
  const items = []; let all = true;
  d.partes.forEach((p, i) => {
    if (st.done[i]) return;
    const pre = multi ? (p.lab || 'Parte ' + (i + 1)) + ': ' : '';
    if (p.tipo === 'single') {
      const o = p.ops.find(x => x.id === st.sel[i]);
      if (o.ok) { st.done[i] = 1; if (multi) items.push({ t: pre + 'correcta.' }); }
      else { all = false; (st.wrong[i] || (st.wrong[i] = [])).push(o.id); st.errs.push(pre + o.t); items.push({ t: pre + o.fb }); st.sel[i] = null; }
    } else {
      const sel = st.sel[i];
      const bad = p.ops.filter(o => !o.ok && sel.includes(o.id)), miss = p.ops.filter(o => o.ok && !sel.includes(o.id));
      if (!bad.length && !miss.length) { st.done[i] = 1; if (multi) items.push({ t: pre + 'correcta.' }); }
      else {
        all = false;
        st.errs.push(pre + 'selección «' + p.ops.filter(o => sel.includes(o.id)).map(o => o.t).join(' | ') + '»');
        bad.forEach(o => items.push({ t: `${pre}«${o.t}» no corresponde. ${o.fb}` }));
        if (miss.length) items.push({ t: `${pre}${miss.length === 1 ? 'falta 1 opción correcta' : 'faltan ' + miss.length + ' opciones correctas'} por seleccionar.` + (p.falta && (st.tries >= 2 || !bad.length) ? ' Pista: ' + p.falta : '') });
      }
    }
  });
  if (all) {
    st.ok = true; st.fb = { k: 'ok', items: [{ t: d.okMsg }] };
    award(id, d.pts[Math.min(st.tries - 1, 3)], { tries: st.tries, errs: st.errs.slice(), ctx: d.ctx || '', resp: d.partes.map(p => (p.lab ? p.lab + ': ' : '') + p.ops.filter(o => o.ok).map(o => o.t).join(' | ')) });
  } else st.fb = { k: 'bad', items };
}
function chHTML(id) {

  const pract = (id in S.pts) && !st.ok;
  const parts = d.partes.map((p, i) => {

      return `<button type="button" id="op-${id}-${i}-${o.id}" class="op${good ? ' is-ok' : ''}${x ? ' is-x' : ''}" data-a="ch-pick" data-ch="${id}" data-p="${i}" data-o="${o.id}" aria-pressed="${on || good ? 'true' : 'false'}" ${locked || x ? 'disabled' : ''}><span class="mk" aria-hidden="true">${mk}</span><span>${esc(o.t)}${good ? ' <b>(correcta)</b>' : ''}${x ? ' (descartada)' : ''}</span></button>`;
    }).join('');
    return `<fieldset class="parte"><legend>${!p.lab && multi ? 'Parte ' + (i + 1) + '. ' : ''}${esc(p.q)}${p.tipo === 'multi' ? ' <span class="tag">selección múltiple</span>' : ''}</legend>${ops}</fieldset>`;

}
